name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Weekly rebuild so GitHub stars and contribution counts stay current.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Refreshes lib/github.generated.json; keeps the committed snapshot on any failure.
      - run: node scripts/fetch-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tells Bing (and through it ChatGPT search and Copilot), Yandex and other IndexNow
  # engines that the site changed. Google does not use IndexNow; it reads the sitemap.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Ping IndexNow
        run: |
          curl -s -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"krishpranav.github.io","key":"0dc0e93055b0bfa277066d21e0eb5266","keyLocation":"https://krishpranav.github.io/0dc0e93055b0bfa277066d21e0eb5266.txt","urlList":["https://krishpranav.github.io/","https://krishpranav.github.io/llms.txt","https://krishpranav.github.io/llms-full.txt","https://krishpranav.github.io/Krisna_Pranav_Resume.pdf"]}'
